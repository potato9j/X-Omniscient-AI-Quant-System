database:
  path: data/omniscient_quant.sqlite3

logging:
  path: logs/collector.log

collection:
  price_interval_seconds: 60
  news_interval_seconds: 600
  request_timeout_seconds: 10
  retry_count: 3
  retry_backoff_seconds: 2.0
  news_pages: 1
  skip_price_collection_outside_market: false

stocks:
  - symbol: "005930"
    name: "Samsung Electronics"
  - symbol: "000660"
    name: "SK hynix"
  - symbol: "035420"
    name: "NAVER"

indices:
  - code: "KOSPI"
    name: "KOSPI"
  - code: "KOSDAQ"
    name: "KOSDAQ"

llm:
  provider: "ollama"
  base_url: "http://localhost:11434"
  model: "gemma4:e2b"
  timeout_seconds: 120
  temperature: 0.0
  num_ctx: 4096
  num_predict: 256

sentiment:
  batch_size: 1
  interval_seconds: 600
  max_items_per_cycle: 20
  max_title_chars: 240

prediction:
  model_path: models/predictor_latest.joblib
  metadata_path: models/metadata.json
  retrain_interval_seconds: 1800
  horizon_steps: 5
  min_training_rows: 50
  test_size: 0.2
  random_state: 42

historical:
  markets:
    - KOSPI
    - KOSDAQ
  max_pages_per_symbol: 100
  max_symbols: 300
  training_max_symbols: 300
  training_max_pages_per_symbol: 100
  on_demand_max_pages_per_symbol: 100
  sleep_min_seconds: 0.8
  sleep_max_seconds: 1.6
  request_timeout_seconds: 10
  retry_count: 3
  retry_backoff_seconds: 2.0

universe:
  markets:
    - KOSPI
    - KOSDAQ
  max_pages_per_market: 80
  request_timeout_seconds: 10
  retry_count: 3
  retry_backoff_seconds: 2.0
